                  <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Live Q&A</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;800&family=DM+Mono:ital,wght@0,400;1,400&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0f;
      --surface: #12121a;
      --border: #1e1e2e;
      --accent: #7c5cfc;
      --accent2: #fc5c7d;
      --text: #e8e6f0;
      --muted: #6b6880;
      --answer-bg: #0f0f1a;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Syne', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 48px 16px 80px;
      position: relative;
      overflow-x: hidden;
    }

    /* Ambient glow background */
    body::before {
      content: '';
      position: fixed;
      top: -200px; left: 50%;
      transform: translateX(-50%);
      width: 700px; height: 700px;
      background: radial-gradient(circle, rgba(124,92,252,0.12) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }
    body::after {
      content: '';
      position: fixed;
      bottom: -200px; right: -100px;
      width: 500px; height: 500px;
      background: radial-gradient(circle, rgba(252,92,125,0.08) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    .container {
      width: 100%; max-width: 720px;
      position: relative; z-index: 1;
    }

    header {
      text-align: center;
      margin-bottom: 48px;
      animation: fadeDown 0.6s ease both;
    }

    .badge {
      display: inline-flex; align-items: center; gap: 6px;
      background: rgba(124,92,252,0.15);
      border: 1px solid rgba(124,92,252,0.3);
      border-radius: 100px;
      padding: 5px 14px;
      font-size: 11px;
      font-family: 'DM Mono', monospace;
      color: var(--accent);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 20px;
    }

    .dot {
      width: 7px; height: 7px;
      background: var(--accent);
      border-radius: 50%;
      animation: pulse 1.4s ease-in-out infinite;
    }

    h1 {
      font-size: clamp(2rem, 5vw, 3.2rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1.1;
      background: linear-gradient(135deg, #fff 40%, var(--accent) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .subtitle {
      margin-top: 12px;
      color: var(--muted);
      font-size: 0.95rem;
      font-weight: 400;
    }

    /* Input area */
    .ask-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 32px;
      animation: fadeUp 0.6s 0.1s ease both;
      transition: border-color 0.2s;
    }
    .ask-box:focus-within {
      border-color: rgba(124,92,252,0.5);
      box-shadow: 0 0 0 3px rgba(124,92,252,0.08);
    }

    .ask-box label {
      display: block;
      font-size: 11px;
      font-family: 'DM Mono', monospace;
      color: var(--muted);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    textarea {
      width: 100%;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-family: 'Syne', sans-serif;
      font-size: 1rem;
      resize: none;
      line-height: 1.6;
      min-height: 80px;
    }

    textarea::placeholder { color: var(--muted); }

    .ask-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid var(--border);
    }

    .char-count {
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      color: var(--muted);
    }

    button#askBtn {
      display: flex; align-items: center; gap: 8px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 10px 22px;
      font-family: 'Syne', sans-serif;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
      box-shadow: 0 4px 20px rgba(124,92,252,0.35);
    }
    button#askBtn:hover:not(:disabled) {
      background: #6a4ce0;
      transform: translateY(-1px);
      box-shadow: 0 6px 24px rgba(124,92,252,0.45);
    }
    button#askBtn:active:not(:disabled) { transform: translateY(0); }
    button#askBtn:disabled { opacity: 0.5; cursor: not-allowed; }

    .send-icon { font-size: 1rem; transition: transform 0.2s; }
    button#askBtn:hover .send-icon { transform: translateX(3px); }

    /* Q&A feed */
    #feed { display: flex; flex-direction: column; gap: 20px; }

    .qa-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      animation: slideIn 0.4s ease both;
    }

    .q-block {
      padding: 18px 22px 14px;
      display: flex; gap: 12px; align-items: flex-start;
    }

    .avatar {
      width: 34px; height: 34px;
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.85rem;
      font-weight: 700;
      flex-shrink: 0;
    }
    .avatar.user { background: rgba(252,92,125,0.18); color: var(--accent2); border: 1px solid rgba(252,92,125,0.25); }
    .avatar.ai   { background: rgba(124,92,252,0.18); color: var(--accent);  border: 1px solid rgba(124,92,252,0.25); }

    .q-text {
      font-size: 0.97rem;
      font-weight: 600;
      line-height: 1.5;
      color: var(--text);
      padding-top: 6px;
    }

    .divider {
      height: 1px;
      background: var(--border);
      margin: 0 22px;
    }

    .a-block {
      padding: 16px 22px 20px;
      display: flex; gap: 12px; align-items: flex-start;
    }

    .a-text {
      font-family: 'DM Mono', monospace;
      font-size: 0.87rem;
      line-height: 1.75;
      color: #c4c0d8;
      padding-top: 7px;
    }

    /* Streaming cursor */
    .cursor {
      display: inline-block;
      width: 2px; height: 1em;
      background: var(--accent);
      margin-left: 2px;
      vertical-align: text-bottom;
      animation: blink 0.8s step-end infinite;
    }

    /* Thinking state */
    .thinking {
      display: flex; gap: 5px; padding-top: 10px;
    }
    .thinking span {
      width: 7px; height: 7px;
      background: var(--accent);
      border-radius: 50%;
      animation: bounce 1.2s ease-in-out infinite;
    }
    .thinking span:nth-child(2) { animation-delay: 0.15s; }
    .thinking span:nth-child(3) { animation-delay: 0.3s; }

    .timestamp {
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      color: var(--muted);
      margin-top: 10px;
    }

    /* Empty state */
    .empty {
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
      animation: fadeUp 0.5s ease both;
    }
    .empty .icon { font-size: 2.5rem; margin-bottom: 12px; opacity: 0.4; }
    .empty p { font-size: 0.9rem; }

    /* Animations */
    @keyframes fadeDown { from { opacity: 0; transform: translateY(-16px); } to { opacity: 1; transform: none; } }
    @keyframes fadeUp   { from { opacity: 0; transform: translateY(16px); }  to { opacity: 1; transform: none; } }
    @keyframes slideIn  { from { opacity: 0; transform: translateY(12px); }  to { opacity: 1; transform: none; } }
    @keyframes pulse    { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
    @keyframes blink    { 0%,100% { opacity: 1; } 50% { opacity: 0; } }
    @keyframes bounce   {
      0%, 80%, 100% { transform: scale(0.8); opacity: 0.4; }
      40%            { transform: scale(1.2); opacity: 1; }
    }
  </style>
</head>
<body>
<div class="container">

  <header>
    <div class="badge"><span class="dot"></span> Live AI Q&amp;A</div>
    <h1>Ask anything.<br>Get answers live.</h1>
    <p class="subtitle">Powered by Claude — real-time streaming responses</p>
  </header>

  <div class="ask-box">
    <label>Your Question</label>
    <textarea id="questionInput" placeholder="Type your question here…" maxlength="500" rows="3"></textarea>
    <div class="ask-footer">
      <span class="char-count" id="charCount">0 / 500</span>
      <button id="askBtn" onclick="askQuestion()">
        Ask <span class="send-icon">→</span>
      </button>
    </div>
  </div>

  <div id="feed">
    <div class="empty">
      <div class="icon">💬</div>
      <p>Your Q&amp;A session will appear here.</p>
    </div>
  </div>

</div>

<script>
  const input = document.getElementById('questionInput');
  const charCount = document.getElementById('charCount');
  const askBtn = document.getElementById('askBtn');
  const feed = document.getElementById('feed');

  input.addEventListener('input', () => {
    charCount.textContent = `${input.value.length} / 500`;
  });

  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) askQuestion();
  });

  function now() {
    return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  }

  async function askQuestion() {
    const q = input.value.trim();
    if (!q) return;

    // Clear empty state
    const empty = feed.querySelector('.empty');
    if (empty) empty.remove();

    askBtn.disabled = true;
    input.value = '';
    charCount.textContent = '0 / 500';

    // Build card
    const card = document.createElement('div');
    card.className = 'qa-card';
    card.innerHTML = `
      <div class="q-block">
        <div class="avatar user">Q</div>
        <div class="q-text">${escapeHTML(q)}</div>
      </div>
      <div class="divider"></div>
      <div class="a-block">
        <div class="avatar ai">AI</div>
        <div>
          <div class="a-text" id="answerText">
            <div class="thinking"><span></span><span></span><span></span></div>
          </div>
          <div class="timestamp" id="ts"></div>
        </div>
      </div>
    `;
    feed.prepend(card);

    const answerEl = card.querySelector('#answerText');
    const tsEl = card.querySelector('#ts');

    try {
      const response = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          model: 'claude-sonnet-4-20250514',
          max_tokens: 1000,
          stream: true,
          messages: [{ role: 'user', content: q }]
        })
      });

      if (!response.ok) throw new Error(`API error: ${response.status}`);

      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let fullText = '';
      let started = false;

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;

        const chunk = decoder.decode(value);
        const lines = chunk.split('\n');

        for (const line of lines) {
          if (!line.startsWith('data: ')) continue;
          const data = line.slice(6).trim();
          if (data === '[DONE]') continue;

          try {
            const parsed = JSON.parse(data);
            const delta = parsed?.delta?.text || '';
            if (delta) {
              if (!started) {
                answerEl.innerHTML = '';
                started = true;
              }
              fullText += delta;
              answerEl.innerHTML = escapeHTML(fullText) + '<span class="cursor"></span>';
            }
          } catch {}
        }
      }

      // Final state
      answerEl.innerHTML = escapeHTML(fullText);
      tsEl.textContent = `Answered at ${now()}`;

    } catch (err) {
      answerEl.innerHTML = `<span style="color:#fc5c7d">⚠ ${escapeHTML(err.message)}</span>`;
    }

    askBtn.disabled = false;
    input.focus();
  }

  function escapeHTML(str) {
    return str
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/\n/g, '<br>');
  }
</script>
</body>
</html>
